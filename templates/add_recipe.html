<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить рецепт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            margin-top: 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form action="/addrecipe" method="POST">
        <h1>Добавить рецепт</h1>

        <label for="name">Название рецепта</label>
        <input type="text" id="name" name="name" placeholder="Например, Оливье" required>

        <label for="category">Категория</label>
        <select id="category" name="category" required>
            <option value="" disabled selected>Выберите категорию</option>
            <option value="Салаты">Салаты</option>
            <option value="Супы">Супы</option>
            <option value="Основные блюда">Основные блюда</option>
            <option value="Десерты">Десерты</option>
            <option value="Напитки">Напитки</option>
        </select>

        <label for="description">Краткое описание</label>
        <textarea id="description" name="description" placeholder="Кратко опишите рецепт..." required></textarea>

        <label for="cooktime">Время приготовления (минуты)</label>
        <input type="number" id="cooktime" name="cooktime" placeholder="Например, 30" required>

        <label for="ingredients">Ингредиенты</label>
        <textarea id="ingredients" name="ingredients" placeholder="Например: Картофель - 3 шт., Майонез - 100 г." required></textarea>

        <label for="instructions">Пошаговая инструкция</label>
        <textarea id="instructions" name="instructions" placeholder="Опишите шаги приготовления..." required></textarea>

        <button type="submit">Добавить рецепт</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список рецептов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
        }
        .recipe-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .recipe-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 300px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .recipe-card h2 {
            font-size: 18px;
            margin: 0 0 10px;
        }
        .recipe-card p {
            font-size: 14px;
            color: #666;
            margin: 5px 0;
        }
        .recipe-card a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #007BFF;
        }
        .recipe-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Список рецептов</h1>
    <div class="recipe-list">
        {% for recipe in recipes %}
        <div class="recipe-card">
            <h2>{{ recipe.name }}</h2>
            <p><strong>Категория:</strong> {{ recipe.category }}</p>
            <p><strong>Описание:</strong> {{ recipe.description }}</p>
            <p><strong>Время приготовления:</strong> {{ recipe.cooktime }} минут</p>
            <a href="#">Подробнее</a>
        </div>
        {% else %}
        <p>Нет доступных рецептов.</p>
        {% endfor %}
    </div>
</body>
</html>
